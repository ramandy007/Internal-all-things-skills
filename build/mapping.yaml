  - name: active-directory-domain-escalation
    title: Active Directory Domain and Forest Escalation
    description: >-
      Escalate from a foothold to domain or forest compromise: ZeroLogon, PrintNightmare,
      NoPAC/sAMAccountName spoofing, MS14-068, PrivExchange, ResetNightmare, SID-history
      injection, trust-key and inter-realm ticket abuse, PAM trusts and ADFS Golden SAML. Use
      when you have low-privileged domain access and need a path to Domain Admin or forest
      takeover, when a trust relationship or ADFS federation exists, or when assessing unpatched
      legacy domain-controller CVEs.
