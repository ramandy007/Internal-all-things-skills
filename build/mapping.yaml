  - name: ibm-cloud-security
    title: IBM Cloud Security
    description: >-
      IBM Cloud reference notes for managed databases (PostgreSQL, MongoDB) and object storage
      (COS): supported engines, storage classes, endpoints, access patterns and service
      characteristics, for when IBM Cloud appears in engagement scope or in leaked configuration.
      Use when you hold an IBM Cloud API key, a COS service-instance ID or a
      *.cloud-object-storage.appdomain.cloud endpoint and need to know what the service is, how it
      is reached and what data it holds, or when reviewing IBM Cloud storage and database
      exposure. Documents the platform only - there is no IBM Cloud attack toolchain here; for
      S3-style bucket mechanics use aws-security.
