  # ------------------------------------------------------------------ router
  - name: internal-engagement-playbook
    title: Internal Engagement Playbook
    description: >-
      Plan and run an authorized internal-network penetration test end to end: scoping, host
      and network discovery, Active Directory and cloud attack-surface mapping, phase-by-phase
      checklists, evidence collection, and vulnerability report writing. Use when starting an
      internal engagement, deciding the next phase of an attack path, planning recon coverage,
      writing a pentest report or finding, or when source-code review or mobile-app testing is
      part of the engagement. Routes to the specialized skills in this library (Active Directory,
      cloud, red team, C2, containers, MSSQL, CI/CD).
    sources:
      - {src: methodology/bug-hunting-methodology.md, ref: bug-hunting-methodology.md}
      - {src: methodology/vulnerability-reports.md, ref: vulnerability-reports.md}
      - {src: methodology/source-code-analysis.md, ref: source-code-analysis.md}
      - {src: methodology/android-applications.md, ref: android-applications.md}

  # ------------------------------------------------------- active directory
  - name: active-directory-enumeration
    title: Active Directory Enumeration and Recon
    description: >-
      Enumerate an Active Directory domain with PowerView, BloodHound, NetExec, impacket and
      native Windows tools: users, groups, computers, trusts, GPOs, ACLs/ACEs, AD-integrated
      DNS, shares, RODC, machine account quota and the AD recycle bin. Use when starting an AD
      engagement, when mapping domain objects and permissions, when you hold any valid domain
      credentials or a null session and need to find attack paths, or when reviewing AD security
      posture. Includes AD operations from Linux (ldapsearch, impacket, netexec, bloodyAD).
    sources:
      - {src: active-directory/ad-adds-enumerate.md, ref: domain-enumeration.md}
      - {src: active-directory/ad-adds-groups.md, ref: groups.md}
      - {src: active-directory/ad-adds-acl-ace.md, ref: acl-ace.md}
      - {src: active-directory/ad-adds-group-policy-objects.md, ref: group-policy-objects.md}
      - {src: active-directory/ad-adds-linux.md, ref: ad-from-linux.md}
      - {src: active-directory/ad-adds-machineaccountquota.md, ref: machine-account-quota.md}
      - {src: active-directory/ad-adds-recycle-bin.md, ref: recycle-bin.md}
      - {src: active-directory/ad-adds-rodc.md, ref: rodc.md}
      - {src: active-directory/ad-integrated-dns.md, ref: adidns.md}
      - {src: active-directory/internal-shares.md, ref: shares.md}
      - {src: active-directory/ad-tricks.md, ref: tricks.md}

  - name: active-directory-kerberos
    title: Active Directory Kerberos Attacks
    description: >-
      Attack Kerberos in Active Directory: Kerberoasting, AS-REP roasting, Timeroasting, ticket
      forging (golden, silver, bronze bit), S4U2Self/S4U2Proxy, and unconstrained, constrained
      and resource-based constrained delegation abuse. Use when you have domain credentials and
      want service-account or privileged-account hashes, when a host or account is trusted for
      delegation, when you need to forge, convert or renew tickets, or when explaining Kerberos
      delegation paths. Covers Rubeus, impacket, NetExec, PowerView and ticket manipulation.
    sources:
      - {src: active-directory/ad-roasting-kerberoasting.md, ref: kerberoasting.md}
      - {src: active-directory/ad-roasting-asrep.md, ref: asrep-roasting.md}
