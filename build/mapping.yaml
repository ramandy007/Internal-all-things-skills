  - name: active-directory-lateral-movement
    title: Active Directory Lateral Movement, Relay and Coercion
    description: >-
      Move laterally and coerce authentication in Active Directory: NTLM relay (SMB, LDAP, HTTP,
      AD CS), Kerberos relay, authentication coercion (PetitPotam, PrinterBug, DFSCoerce, Coerce)
      and DCOM execution. Use when you have credentials or a machine account and need code
      execution on another host, when a target lacks SMB or LDAP signing, when you need a victim
      to authenticate to your listener, or when chaining coercion into relay or AD CS.
    sources:
      - {src: active-directory/internal-relay-ntlm.md, ref: ntlm-relay.md}
      - {src: active-directory/internal-relay-kerberos.md, ref: kerberos-relay.md}
      - {src: active-directory/internal-relay-coerce.md, ref: coercion.md}
      - {src: active-directory/internal-dcom.md, ref: dcom.md}

  - name: active-directory-enterprise-systems
    title: Enterprise Management Systems (SCCM, SCOM, WSUS, MDT)
    description: >-
      Compromise enterprise management and deployment infrastructure in Windows environments:
      SCCM/MECM (site takeover, network access accounts, PXE, client push), SCOM, WSUS and MDT,
      plus PXE boot image extraction. Use when you find SCCM, SCOM, WSUS or MDT in an internal
      network, when reviewing deployment credentials or task sequences, or when pivoting from a
      workstation to the systems that distribute privileged software and scripts.
    sources:
