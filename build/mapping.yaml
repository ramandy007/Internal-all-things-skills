  - name: active-directory-credentials
    title: Active Directory Credential Theft and Reuse
    description: >-
      Steal and abuse Active Directory credentials: LSASS, SAM and NTDS.dit dumping, hash capture
      and cracking, pass-the-hash, pass-the-key, overpass-the-hash, password spraying, GPP
      cpassword, LAPS, gMSA and dMSA, DSRM, passwords in user comments, pre-created computer
      accounts and Shadow Credentials (msDS-KeyCredentialLink). Use when you need credentials or
      hashes from a host or the domain, when planning a password spray, when you find a readable
      attribute or policy containing secrets, or when converting recovered material into a
      usable session.
