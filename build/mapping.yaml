      - {src: active-directory/kerberos-delegation-constrained.md, ref: delegation-constrained.md}
      - {src: active-directory/kerberos-delegation-unconstrained.md, ref: delegation-unconstrained.md}
      - {src: active-directory/kerberos-delegation-rbcd.md, ref: delegation-rbcd.md}

  - name: active-directory-certificates
    title: AD CS Certificate Attacks (ESC1-ESC15)
    description: >-
      Exploit Active Directory Certificate Services (AD CS): ESC1 through ESC15 misconfigurations,
      certificate template and CA abuse, enrollment agent paths, Golden Certificates and
      certificate-based persistence. Use when a domain has an enterprise CA, when BloodHound or
      Certipy output shows certificate templates or enrollment rights, when you need a certificate
      that authenticates as another user or machine, or when reviewing PKI hardening. Covers
      Certipy, Certify, bloodyAD, ForgeCert, Rubeus and PKINIT abuse.
